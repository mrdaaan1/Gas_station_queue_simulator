<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// Просмотр модели машины: материалы по ключам, как в игре (CarMaterials)
const params = new URLSearchParams(location.search);
const paint = params.get('paint') || '#c8141e';
const satin = params.get('satin') === '1';
const W = +(params.get('w') || 1000), H = +(params.get('h') || 620);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(params.get('bg') || '#cfd6dd');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(4, 8, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 });
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xdde6ff, 0x404040, 0.6));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: '#8a8d90', roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; if (!params.get('bg')) scene.add(ground);

const std = (c, r = 0.5, m = 0, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m, ...extra });
const mats = {
  paint: satin ? new THREE.MeshPhysicalMaterial({ color: paint, roughness: 0.45, metalness: 0.35, clearcoat: 0.3, clearcoatRoughness: 0.5 }) : new THREE.MeshPhysicalMaterial({ color: paint, roughness: 0.32, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.05 }),
  glass: new THREE.MeshPhysicalMaterial({ color: '#1d2a33', roughness: 0.05, metalness: 0.2, transparent: true, opacity: 0.55 }),
  lens: new THREE.MeshPhysicalMaterial({ color: '#e8f0f6', roughness: 0.03, metalness: 0.1, transparent: true, opacity: 0.22 }),
  black: std('#0b0b0d', 0.55), trim: std('#151517', 0.7), rubber: std('#141414', 0.9), tread: std('#0a0a0a', 0.95),
  chrome: std('#e4e8ec', 0.12, 1), alloy: std('#c9ccd0', 0.25, 0.9), rim_inner: std('#7d8186', 0.45, 0.7),
  disc: std('#6a6c70', 0.5, 0.8), caliper: std('#b5161b', 0.4, 0.2), housing: std('#25282d', 0.35, 0.4),
  reflector: std('#f0f2f4', 0.1, 1), amber: std('#ff8a1c', 0.3, 0, { emissive: '#3a1800' }), tail_red: std('#c8121a', 0.25, 0, { emissive: '#3a0003' }),
  tail_clear: std('#dde6ee', 0.15, 0.3), lamp_glow: std('#fff7e0', 0.2, 0, { emissive: '#fff2c8', emissiveIntensity: 0.6 }),
  int_door: std('#1c1c1f', 0.8), int_roof: std('#3c3c41', 0.9), carpet: std('#151515', 1), leather_red: std('#9e1219', 0.55),
  leather_black: std('#141416', 0.55), int_black: std('#1a1a1d', 0.7), int_grey: std('#8b8e93', 0.45, 0.35),
  gauge_face: std('#0a0a0b', 0.4), gauge_glow: std('#ff3a12', 0.4, 0, { emissive: '#ff2a00', emissiveIntensity: 1.2 }),
  white: std('#f2f2f2', 0.5), needle: std('#ff3320', 0.4, 0, { emissive: '#661100' }), plate: std('#f4f4f4', 0.4), plate_text: std('#111', 0.5),
  grille: std('#0d0d0f', 0.85), led_off: std('#2a1a0c', 0.8), led_on: std('#ffb020', 0.4, 0, { emissive: '#ff9a10' }), stripe_white: std('#f7f7f7', 0.4), stripe_magenta: std('#c2188a', 0.35), stripe_purple: std('#6b1f8e', 0.35), fur_pink: std('#f3d6dc', 1.0), tail_smoke: std('#3a0c10', 0.15, 0, { emissive: '#200004' }), stripe_silver: new THREE.MeshPhysicalMaterial({ color: '#d9dde2', roughness: 0.3, metalness: 0.5, clearcoat: 1 }), stripe_green: std('#3fdc4a', 0.4), stripe_yellow: std('#f2c81a', 0.4),
  leather_tan: std('#c49a6c', 0.55), carbon: std('#2b2d31', 0.25, 0.3), stripe: new THREE.MeshPhysicalMaterial({ color: '#2f7fe0', roughness: 0.3, metalness: 0.1, clearcoat: 1 }), stripe_dark: new THREE.MeshPhysicalMaterial({ color: '#1d3fae', roughness: 0.3, metalness: 0.1, clearcoat: 1 }),
  wing_blue: new THREE.MeshPhysicalMaterial({ color: '#2347c4', roughness: 0.3, metalness: 0.1, clearcoat: 1 }), cloth_dark: std('#1e1f22', 0.95), leather_blue: std('#2456c8', 0.5), gauge_light: std('#d8d8d4', 0.5), screen_amber: std('#2a1a05', 0.3, 0, { emissive: '#c88a20', emissiveIntensity: 0.7 }), glass_dark: std('#0e1216', 0.08, 0.3), chassis: std('#1b1b1c', 0.8), rim_black: std('#151517', 0.35, 0.4), black_satin: std('#1c1d20', 0.55, 0.2), bin_inner: std('#16291a', 0.9), paint_dark: std('#1f3d1e', 0.6), helmet_lime: new THREE.MeshPhysicalMaterial({ color: '#b7dc3c', roughness: 0.3, clearcoat: 1 }), helmet_white: new THREE.MeshPhysicalMaterial({ color: '#f3f3ef', roughness: 0.3, clearcoat: 1 }), visor: new THREE.MeshPhysicalMaterial({ color: '#1a2230', roughness: 0.08, metalness: 0.5, clearcoat: 1 }), jacket_dark: std('#24262b', 0.9),
  screen_blue: std('#0a1838', 0.3, 0, { emissive: '#1a3a8a', emissiveIntensity: 0.9 }), ambient: std('#2a5cff', 0.4, 0, { emissive: '#2a5cff', emissiveIntensity: 1.5 }), hair: std('#3a2717', 0.8), lamp_off: std('#3a2a10', 0.5), screen: std('#0c1a12', 0.3, 0, { emissive: '#103020' }), liner: std('#0c0c0c', 0.95), mirror: std('#dfe6ee', 0.05, 1), skin: std('#e2b08a', 0.7), jacket: std('#2a2c33', 0.8),
};
// camo=1 — золотой хромированный камуфляж (как TextureFactory.GoldCamo): угловатые пятна, сильное отражение
if (params.get('camo') === '1') {
  const S = 256, N = 16, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const cx = cv.getContext('2d'), img = cx.createImageData(S, S);
  let seed = 70; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pts = [], tone = [];
  for (let i = 0; i < N; i++) { pts.push([rnd() * S, rnd() * S]); const r = rnd(); tone.push(r < 0.38 ? 0 : r < 0.70 ? 1 : r < 0.90 ? 2 : 3); }
  const pal = [[255, 212, 64], [238, 168, 16], [184, 112, 8], [104, 60, 6]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let best = 1e9, bi = 0;
    for (let i = 0; i < N; i++) { let dx = Math.abs(x - pts[i][0]), dy = Math.abs(y - pts[i][1]); if (dx > S / 2) dx = S - dx; if (dy > S / 2) dy = S - dy; const d = dx * dx + dy * dy + 0.6 * dx * dy; if (d < best) { best = d; bi = i; } }
    const c = pal[tone[bi]], k = (y * S + x) * 4; img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = 255;
  }
  cx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.colorSpace = THREE.SRGBColorSpace;
  mats.paint = new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.14, metalness: 0.6, clearcoat: 1, clearcoatRoughness: 0.04 });
}
try { const dt = await new THREE.TextureLoader().loadAsync('pitbull.png'); dt.colorSpace = THREE.SRGBColorSpace; mats.decal_pit = std('#ffffff', 0.5); mats.decal_pit.map = dt; } catch (e) {}
const missing = new Set();
const data = await (await fetch(params.get('model') || 'model.json')).json();
const car = new THREE.Group();
const ids = params.get('ids') === '1';
const idMats = {};
const hide = (params.get('hide') || '').split(',').filter(Boolean);
for (const m of data.meshes) {
  if (hide.some(h => m.node.startsWith(h) || m.mat === h)) continue;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(m.p, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(m.n, 3));
  if (m.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(m.uv, 2));
  g.setIndex(m.i);
  let mat = mats[m.mat];
  if (!mat) { missing.add(m.mat); mat = std('#ff00ff', 0.5); }
  if (ids) {
    // Отладка: каждый узел:материал своим цветом без освещения
    const key = m.node + ':' + m.mat;
    if (!idMats[key]) {
      const k = Object.keys(idMats).length;
      const c = new THREE.Color().setHSL((k * 0.618) % 1, 0.9, 0.35 + 0.3 * ((k * 0.37) % 1));
      idMats[key] = new THREE.MeshBasicMaterial({ color: c });
      console.log('id ' + key + ' #' + c.getHexString());
    }
    mat = idMats[key];
  }
  const mesh = new THREE.Mesh(g, mat);
  mesh.castShadow = m.mat !== 'glass' && m.mat !== 'lens'; mesh.receiveShadow = true;
  car.add(mesh);
}
scene.add(car);
function shot(pos, at, fov, x, y, w, h) {
  const cam = new THREE.PerspectiveCamera(fov, w / h, 0.02, 100);
  const [px, py, pz] = pos.split(',').map(Number), [tx, ty, tz] = at.split(',').map(Number);
  cam.position.set(px, py, -pz); cam.lookAt(tx, ty, -tz);
  renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h); renderer.setScissorTest(true);
  renderer.render(scene, cam);
}
if (params.get('grid') === '1') {
  // Шесть ракурсов сеткой 2×3 (координаты Unity): перед-3/4, зад-3/4, бок, сверху над салоном, спереди, из салона
  const views = [
    ['5.2,1.6,5.0', '0,0.6,0', 32], ['-5.0,1.7,-5.2', '0,0.6,-0.2', 32],
    ['8.5,0.9,0', '0,0.7,0', 30], ['2.6,3.6,-1.6', '0,0.9,0.2', 45],
    ['0,1.0,8', '0,0.75,0', 24], [params.get('cab') || '-0.38,1.40,-0.20', params.get('cabat') || '-0.3,1.2,1.5', 72],
  ];
  const w = W / 2, h = H / 3;
  views.forEach((v, i) => shot(v[0], v[1], v[2], (i % 2) * w, H - (Math.floor(i / 2) + 1) * h, w, h));
} else shot(params.get('pos') || '5.5,1.8,5', params.get('at') || '0,0.55,0', +(params.get('fov') || 32), 0, 0, W, H);
document.title = 'done ' + [...missing].join(',');
</script></body></html>
